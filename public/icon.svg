<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">HeatReel</title>
  <defs>
    <!-- Shared by the tile and the play cut-out (userSpaceOnUse), so the
         triangle reads as a hole punched through the flame. -->
    <linearGradient id="heat" x1="20" y1="124" x2="108" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5162B"/>
      <stop offset="0.55" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FFB224"/>
    </linearGradient>
    <!-- Soft glow from the top for depth at large sizes. -->
    <radialGradient id="glow" cx="64" cy="10" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="64" y1="14" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7A0A12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#heat)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>

  <!-- Flame -->
  <path filter="url(#shadow)" fill="url(#flame)" d="
    M66 14
    C69 30 82 39 90 52
    C98 65 99 82 91 95
    C84 106 74 112 64 112
    C46 112 31 99 30 80
    C29 67 35 56 44 48
    C44 58 48 65 55 68
    C51 50 55 31 66 14 Z"/>

  <!-- Play button punched through the flame -->
  <path fill="url(#heat)" d="M56 70 L56 98 Q56 102 59.5 100 L80 88 Q83.5 86 80 84 L59.5 72 Q56 70 56 74 Z"/>
</svg>
