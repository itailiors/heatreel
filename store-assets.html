<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatReel – Store Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * HeatReel – Chrome Web Store promo images.
   * Small promo tile 440×280 and marquee 1400×560. Both are fully opaque
   * (the store rejects transparency). Capture each .banner exactly.
   */
  :root {
    --font: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { min-height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 50px;                 /* space between the banners */
    padding: 60px 20px;
    background: #8a8a92;       /* neutral grey so the banner edges are obvious when snipping */
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .slot { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .caption {
    font: 500 13px/1 var(--font);
    color: #1d1d21;
    letter-spacing: 0.02em;
  }

  /* ---------- Shared banner look ---------- */

  .banner {
    position: relative;
    overflow: hidden;
    flex: none;
    /* Solid base colour first, so nothing is ever transparent. */
    background-color: #111113;
    background-image:
      radial-gradient(ellipse 55% 75% at 50% 42%, rgba(255, 90, 31, 0.26) 0%, rgba(255, 90, 31, 0) 70%),
      linear-gradient(135deg, #0f0f11 0%, #17151a 38%, #2a1214 72%, #4a170d 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .wave {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    pointer-events: none;
  }

  .content {
    position: relative;        /* above the wave */
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    display: block;
    filter: drop-shadow(0 10px 30px rgba(255, 70, 20, 0.45));
  }

  .title {
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #fff;
  }


  /* ---------- Small promo tile: 440 × 280 ---------- */

  .banner.small { width: 440px; height: 280px; }
  .banner.small .wave { height: 64px; }
  .banner.small .logo { width: 116px; height: 116px; }
  .banner.small .title { margin-top: 18px; font-size: 46px; }

  /* ---------- Marquee: 1400 × 560 ---------- */

  .banner.large { width: 1400px; height: 560px; }
  .banner.large .wave { height: 130px; }
  .banner.large .logo { width: 176px; height: 176px; }
  .banner.large .title { margin-top: 30px; font-size: 96px; }
  .banner.large .tagline {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: rgba(255, 255, 255, 0.78);
  }

  /* ---------- Scaling helper ---------- */

  .scale-note {
    max-width: 720px;
    font: 500 13px/1.45 var(--font);
    color: #1d1d21;
    text-align: center;
  }
  .scale-note:empty { display: none; }
</style>
</head>

<script>
  /*
   * Windows display scaling (125%, 150%…) or browser zoom makes a 440px box
   * snip as 550px, 660px… which the Web Store rejects. Shrink the banners by
   * the same factor so one CSS pixel = one screen pixel and the snip comes out
   * at the exact size. (Re-runs if you move the window to another monitor.)
   */
  function fitToScreenPixels() {
    const dpr = window.devicePixelRatio || 1;
    const note = document.getElementById('scale-note');
    document.querySelectorAll('.slot').forEach((el) => {
      el.style.zoom = dpr === 1 ? '' : String(1 / dpr);
    });
    note.textContent = dpr === 1
      ? ''
      : `Your screen scaling is ${Math.round(dpr * 100)}%, so the banners are shown smaller here ` +
        `to make a snip come out at exactly 440 × 280 and 1400 × 560. Set browser zoom to 100% (Ctrl+0) first.`;
  }
  fitToScreenPixels();
  matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change', fitToScreenPixels);
  window.addEventListener('resize', fitToScreenPixels);
</script>
